<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>義式餐廳_點餐系統</title>

    <link rel="stylesheet" href="css/style.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body>

    <div class="container">
        <div class="menu-header">
            <h2 class="menu-title">意式餐廳菜單</h2>

            <div class="row row-cols-6 g-1 category-bar">
                <div class="col">
                    <button class="btn btn-light w-100 category-btn" onclick="showProducts('全部', this)">
                        全部</button>
                </div>
                <div class="col">
                    <button class="btn btn-light w-100 category-btn" onclick="showProducts('主餐', this)">
                        主餐</button>
                </div>
                <div class="col">
                    <button class="btn btn-light w-100 category-btn" onclick="showProducts('開胃菜', this)">
                        開胃菜</button>
                </div>
                <div class="col">
                    <button class="btn btn-light w-100 category-btn" onclick="showProducts('飲品', this)">
                        飲品</button>
                </div>
                <div class="col">
                    <button class="btn btn-light w-100 category-btn" onclick="showProducts('甜點', this)">
                        甜點</button>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-8">
                <div class="row" id="productList">
    
                </div>
            </div>
            
            <div class="col-md-4">
                <div class="cart-box">
                    <div class="cart-inner">
                        <h2 onclick="toggleCart()" class="cart-title">
                            <span>
                                <i class="bi bi-list"></i>
                                我的訂單
                            </span>
                            <i id="arrow" class="bi bi-chevron-up"></i>
                        </h2>
                        <div id="cartArea" class="cart-area">
                            <div class="cart-content">
                                <div id="cartList">

                                </div>
                            </div>
                            <div class="cart-footer d-flex justify-content-between align-items-center">
                                <h5 class="mb-0">
                                <i class="bi bi-cash-stack"></i>
                                總金額:
                                NT$<span id="total">0</span>
                                </h5>
                                <button class="btn btn-success checkout-btn" onclick="checkout()">
                                結帳
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="cartToast" class="toast" role="alert">
            <div class="toast-header">
                <strong class="me-auto">義式餐廳</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast">
                </button>
            </div>
            <div id="toastMessage" class="toast-body"></div>
        </div>
    </div>

    <!-- 客製化選項 Modal -->
    <div class="modal fade" id="customizeModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">客製化選項</h5>
                    <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                    </button>
                </div>
                <div class="modal-body">

                    <h4 id="modalProductName"></h4>
                    <hr>
                    <div id="modalOptions"></div>
                </div>
                <div class="modal-footer">

                    <button class="btn btn-success"
                            onclick="confirmAddCart()">
                        加入購物車
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="products.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script>

</body>

</html>
